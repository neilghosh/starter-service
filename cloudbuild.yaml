# Cloud Build pipeline for `main` branch merges:
# 1. Runs unit tests
# 2. Builds and pushes container image to Artifact Registry
# 3. Deploys a new Cloud Run revision
# 4. Switches 100% of Cloud Run traffic to the latest revision
substitutions:
  _REGION: us-central1
  _AR_REPO: starter-service
  _SERVICE: starter-service

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: test
    name: node:20-alpine
    entrypoint: npm
    args: ['test']

  - id: build-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - COMMIT_SHA=$SHORT_SHA
      - --build-arg
      - DEPLOY_TAG=main
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:latest
      - .

  - id: push-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}

  - id: deploy-revision
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --no-traffic
      - --set-env-vars=COMMIT_SHA=$SHORT_SHA,DEPLOY_TAG=main

  - id: switch-traffic
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - services
      - update-traffic
      - ${_SERVICE}
      - --region=${_REGION}
      - --to-latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:latest
